name: Generate pubspec.lock

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V27
        run: |
          rm -rf project
          mkdir project
          unzip -q offline_music_player_V27_CONFIRMED_BUGS_FIXED_V3.zip -d project

      - name: Check pubspec.yaml
        run: |
          test -f project/src/pubspec.yaml
          echo "pubspec.yaml found:"
          ls -lh project/src/pubspec.yaml

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Generate pubspec.lock
        working-directory: project/src
        run: |
          flutter --version
          flutter pub get

      - name: Verify pubspec.lock
        run: |
          test -f project/src/pubspec.lock
          echo "pubspec.lock generated successfully:"
          ls -lh project/src/pubspec.lock

      - name: Upload pubspec.lock
        uses: actions/upload-artifact@v4
        with:
          name: pubspec-lock
          path: project/src/pubspec.lock
