name: Generate pubspec.lock

on:
  workflow_dispatch:

jobs:
  generate-lockfile:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true

      - name: Verify Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Check pubspec.yaml
        run: |
          test -f pubspec.yaml
          echo "pubspec.yaml found"

      - name: Generate pubspec.lock
        run: |
          flutter pub get

      - name: Verify pubspec.lock
        run: |
          test -f pubspec.lock
          ls -lh pubspec.lock
          echo "pubspec.lock successfully generated"

      - name: Upload pubspec.lock
        uses: actions/upload-artifact@v4
        with:
          name: pubspec-lock-flutter-3.44.7
          path: pubspec.lock
          if-no-files-found: error
